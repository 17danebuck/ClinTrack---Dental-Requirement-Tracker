<script>
(function () {
const { validateAndMigrateState } = window.ClinicTrackDomain;

const STATE_KEY = 'clinictrack-state';
const COMMUNITY_KEY = 'clinictrack-community-quotes';
const RECOVERY_KEY = 'clinictrack-state-recovery';
let lastLoadError = null;

function loadState(storage = localStorage) {
  lastLoadError = null;
  const raw = storage.getItem(STATE_KEY);
  try { return validateAndMigrateState(JSON.parse(raw)); }
  catch (error) {
    // Keep the original payload before presenting a usable blank state. This
    // prevents a later normal save from being the only remaining copy.
    try { if (raw) storage.setItem(RECOVERY_KEY, raw); } catch (_) {}
    lastLoadError = { message: 'Saved ClinicTrack data could not be read. A recovery copy was preserved on this device.', error };
    return validateAndMigrateState(null);
  }
}

function saveState(state, storage = localStorage) {
  try { storage.setItem(STATE_KEY, JSON.stringify(state)); return { ok: true }; }
  catch (error) { return { ok: false, error }; }
}

function loadQuotes(storage = localStorage) {
  try { const value = JSON.parse(storage.getItem(COMMUNITY_KEY)); return Array.isArray(value) ? value.filter((item) => typeof item === 'string') : []; }
  catch { return []; }
}

function saveQuotes(quotes, storage = localStorage) {
  try { storage.setItem(COMMUNITY_KEY, JSON.stringify(quotes)); return { ok: true }; }
  catch (error) { return { ok: false, error }; }
}

function getLoadError() { return lastLoadError; }
function loadRecovery(storage = localStorage) {
  const raw = storage.getItem(RECOVERY_KEY);
  return raw ? JSON.parse(raw) : null;
}
function clearRecovery(storage = localStorage) { storage.removeItem(RECOVERY_KEY); }

window.ClinicTrackStorage = { COMMUNITY_KEY, RECOVERY_KEY, STATE_KEY, clearRecovery, getLoadError, loadQuotes, loadRecovery, loadState, saveQuotes, saveState };
})();

</script>

    '<nav class="main-nav" aria-label="Primary navigation"><div class="brand"><span>ClinicTrack<small>Creighton dental school · real progress</small></span></div><button class="nav-btn '+(activeView==='dashboard'?'active':'')+'" data-view="dashboard">Home</button><button class="nav-btn '+(activeView==='experience'?'active':'')+'" data-view="experience">Experience</button><button class="nav-btn '+(activeView==='requirements'?'active':'')+'" data-view="requirements">Requirements</button><button class="nav-btn '+(activeView==='patients'?'active':'')+'" data-view="patients">Patients</button><button class="nav-btn '+(activeView==='pearls'?'active':'')+'" data-view="pearls">Daily Pearls</button></nav>'
    +'<section id="dashboard-view" class="dashboard '+(activeView==='dashboard'?'':'view-hidden')+'"><header class="dashboard-heading"><img class="home-bluejay" src="assets/creighton-bluejay.png" alt="Creighton Bluejay" /><div><h1>Creighton School of Dentistry</h1><p>Good afternoon. Log today. Build tomorrow.</p></div><div class="dashboard-date">'+esc(displayDate)+'<small>Creighton dental ledger</small></div></header>'
    +'<div class="metrics dashboard-metrics"><div class="metric tracked-metric"><div class="metric-icon">✓</div><div><div class="lbl">Tracked Requirements</div><div class="num">'+trackedPct+'%</div><small>complete · '+trackedComplete+' / '+trackedTarget+' tracked units</small></div></div><div class="metric"><div class="metric-icon">✦</div><div><div class="lbl">Procedures Logged</div><div class="num">'+eventCount+'</div><small>Total clinical events</small></div></div><div class="metric"><div class="metric-icon">♙</div><div><div class="lbl">Patients</div><div class="num">'+activePatientCount+'</div><small>Active patients</small></div></div><div class="metric"><div class="metric-icon">★</div><div><div class="lbl">Clinical Points</div><div class="num">'+clinicalPoints+'</div><small>From completed events</small></div></div></div>'
    +'<div class="dashboard-action"><button class="primary dashboard-add" id="quick-add">＋ Add Clinical Event</button></div>'
    +'<div class="dashboard-grid priority-grid"><section class="dashboard-card"><div class="panel-heading"><h2>Your Priorities</h2><button class="text-action" data-view="requirements">Review →</button></div><div id="gaps">'+gapsHtml+'</div></section><section class="dashboard-card"><div class="panel-heading"><h2>Upcoming Opportunities</h2><button class="text-action" data-view="patients">Patients →</button></div><div id="opportunities">'+oppHtml+'</div></section></div>'
    +'<div class="dashboard-grid top-grid"><section class="dashboard-card activity-card"><div class="panel-heading"><h2>Recent Activity</h2><button class="text-action" data-view="experience">View all →</button></div><div class="ledger-head"><span>Date</span><span>Procedure</span><span>Status</span><span>Patient</span><span>Points</span></div><div class="ledger">'+recentActivity+'</div></section><section class="dashboard-card pearl-card" id="daily-pearl"><div class="panel-heading"><h2>Today’s Daily Pearl</h2><button class="text-action" data-view="pearls">Library →</button></div><p class="quote" id="quote-text">“'+esc(currentPearl.text)+'”</p><div class="pearl-rule"></div><small>'+esc(currentPearl.category)+'</small><div class="pearl-compose"><input type="text" id="quote-input" placeholder="Add a personal reminder" /><button id="quote-add">Save</button></div><p class="err" id="quote-err"></p><div id="community-list">'+communityHtml+'</div></section></div>'
    +'<div class="dashboard-grid lower-grid"><section class="dashboard-card compact-panel"><div class="panel-heading"><h2>Clinical Experience</h2><button class="text-action" data-view="experience">View details →</button></div><div class="summary-list">'+experienceRows+'</div></section><section class="dashboard-card compact-panel"><div class="panel-heading"><h2>Requirements</h2><button class="text-action" data-view="requirements">View all →</button></div><div class="summary-list">'+requirementRows+'</div><div class="progress-footer"><strong>'+trackedPct+'%</strong><span>tracked progress</span></div></section><section class="dashboard-card compact-panel" id="patients-panel"><div class="panel-heading"><h2>Patients</h2><button class="text-action" data-view="patients">View all →</button></div><div class="patient-list">'+patientSummary+'</div><button class="outline-action" id="dashboard-add-patient">＋ Add Patient</button></section></div>'
    +'<details class="tracker-management" id="patient-management"><summary>Manage tracker data</summary><p class="muted">Edit requirements, competencies, patients, and existing events.</p>'+dataTools+'<h2>Requirements</h2><div id="requirements">'+reqRows+'</div>'
    +'<div class="row" style="margin-top:12px;">'
      +'<input type="text" id="new-req-name" placeholder="New requirement, e.g. Bridges" style="flex:1;" />'
      +'<input type="number" min="0" id="new-req-count" placeholder="#" style="width:56px;" />'
      +'<button id="add-req">Add</button>'
    +'</div><p class="err" id="req-err"></p>'
    +'<h2>Competencies</h2>'
    +'<div class="comp-grid" id="competencies">'+compGrid+'</div>'
    +'<div class="row" style="margin-top:12px;">'
      +'<input type="text" id="new-comp-name" placeholder="New competency, e.g. Sedation" style="flex:1;" />'
      +'<button id="add-comp">Add</button>'
    +'</div><p class="err" id="comp-err"></p>'
    +'<h2>What you need</h2>'
    +'<div id="gaps">'+gapsHtml+'</div>'
    +'<h2>Patients</h2>'
    +'<div id="patients">'+patientsHtml+'</div>'
    +'<div class="row" style="margin-top:12px;">'
      +'<input type="text" id="new-patient" placeholder="New patient, e.g. Patient 4827" style="flex:1;" />'
      +'<button id="add-patient">Add</button>'
    +'</div><p class="err" id="patient-err"></p>'
    +'<p class="saved-note" style="margin-top:24px;">Data is saved in this browser, on this device. Opening the file on another device or browser starts fresh.</p><button class="reset" id="reset-btn">Start over</button></details></section>'
    +experienceMarkup()
    +requirementsMarkup()
    +patientsMarkup()
    +pearlsMarkup()
    +quickAddMarkup()+confirmationMarkup()+(successMessage?'<div class="success-toast" role="status">'+esc(successMessage)+'</div>':'')+(persistenceError?'<div class="err" role="alert" style="position:fixed;left:20px;right:20px;bottom:76px;z-index:31;background:#fff;padding:10px;border:1px solid var(--danger);border-radius:6px;">'+esc(persistenceError)+'</div>':'');

  attachEvents();
}

function attachEvents(){
  document.querySelectorAll('.nav-btn[data-view]').forEach(function(button){button.onclick=function(){activeView=button.dataset.view;render();};});
  if(confirmation){
    document.getElementById('confirm-cancel').onclick=function(){confirmation=null;render();};
    document.getElementById('confirm-accept').onclick=function(){var action=confirmation.action;confirmation=null;action();};
  }
  document.querySelectorAll('[data-target]').forEach(function(button){button.onclick=function(){var target=document.getElementById(button.dataset.target);if(target){if(target.tagName==='DETAILS')target.open=true;target.scrollIntoView({behavior:'smooth',block:'start'});}};});
  document.querySelectorAll('.text-action[data-view]').forEach(function(button){button.onclick=function(){activeView=button.dataset.view;render();};});
  document.querySelectorAll('.event-edit').forEach(function(button){button.onclick=function(){var event=state.clinicalEvents.find(function(item){return item.id===button.dataset.eid;});if(event)openQuickAdd(event);};});
  document.querySelectorAll('.patient-summary').forEach(function(button){button.onclick=function(){var manager=document.getElementById('patient-management');if(manager)manager.open=true;var patient=document.getElementById('patient-'+button.dataset.id);if(patient)patient.scrollIntoView({behavior:'smooth',block:'center'});};});
  var dashboardAddPatient=document.getElementById('dashboard-add-patient');
  if(dashboardAddPatient)dashboardAddPatient.onclick=function(){var manager=document.getElementById('patient-management');if(manager){manager.open=true;manager.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(function(){var field=document.getElementById('new-patient');if(field)field.focus();},250);}};
  document.getElementById('quick-add').onclick=function(){openQuickAdd(null);};
  var experienceAdd=document.getElementById('experience-add');
  if(experienceAdd)experienceAdd.onclick=function(){openQuickAdd(null);};
  var patientsAddEvent=document.getElementById('patients-add-event');
  if(patientsAddEvent)patientsAddEvent.onclick=function(){openQuickAdd(null);};
  var patientsAddPatient=document.getElementById('patients-add-patient');
  if(patientsAddPatient)patientsAddPatient.onclick=function(){activeView='dashboard';render();var shortcut=document.getElementById('dashboard-add-patient');if(shortcut)shortcut.click();};
  document.getElementById('export-data').onclick=function(){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download='clinictrack-backup-'+today()+'.json';document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);
  };
  document.getElementById('import-data').onchange=function(event){
    var file=event.target.files&&event.target.files[0];if(!file)return;
    var reader=new FileReader();reader.onload=function(){
      try { var imported=validateAndMigrateState(JSON.parse(reader.result)); askConfirmation('Replace local ClinicTrack data?','This will replace the current data on this browser with the selected backup.',function(){state=imported;persistenceError='';saveState();successMessage='Backup imported';render();},'Import'); }
      catch(error){var errorBox=document.getElementById('data-err');if(errorBox)errorBox.textContent='This backup could not be read.';}
    };reader.readAsText(file);
  };
  var restoreRecovery=document.getElementById('restore-recovery');
  if(restoreRecovery)restoreRecovery.onclick=function(){
    try { var recovered=validateAndMigrateState(loadRecovery()); askConfirmation('Restore preserved recovery data?','This will replace the current data on this browser with the preserved recovery copy.',function(){state=recovered;saveState();clearRecovery();persistenceError='';successMessage='Recovery copy restored';render();},'Restore'); }
    catch(error){persistenceError='The preserved recovery copy could not be read.';render();}
  };
  document.querySelectorAll('#experience-view .proc-edit').forEach(function(button){button.onclick=function(){var event=state.clinicalEvents.find(function(item){return item.id===button.dataset.eid;});if(event)openQuickAdd(event);};});
  if(quickAdd){
    document.querySelectorAll('.procedure-choice').forEach(function(button){button.onclick=function(){quickAdd={...quickAdd,procedureType:button.dataset.type,canalCount:button.dataset.type==='rct'?(quickAdd.canalCount??1):null,errors:{}};render();};});
    document.getElementById('quick-close').onclick=function(){quickAdd=null;render();};
    document.getElementById('quick-cancel').onclick=function(){quickAdd=null;render();};
    var quickDelete=document.getElementById('quick-delete');
    if(quickDelete)quickDelete.onclick=function(){
      var eventId=quickAdd.id;askConfirmation('Delete this clinical event?','This will remove it from your clinical history and progress totals.',function(){state=deleteClinicalEvent(state,eventId);saveState();quickAdd=null;successMessage='Event deleted';render();});
    };
    document.getElementById('quick-save').onclick=function(){
      var selectedType=quickAdd.procedureType;
      var matchingRequirement=state.requirements.find(function(requirement){return procedureTypeForRequirement(requirement)===selectedType;});
      var input={procedureType:selectedType,quantity:document.getElementById('quick-quantity').value,status:document.getElementById('quick-status').value,date:document.getElementById('quick-date').value,patientId:document.getElementById('quick-patient').value||null,notes:document.getElementById('quick-notes').value,canalCount:selectedType==='rct'?document.getElementById('quick-canals').value:null,requirementId:quickAdd.requirementId||(matchingRequirement?matchingRequirement.id:null),requirementName:quickAdd.requirementName||(matchingRequirement?matchingRequirement.name:'')};
      var wasEditing=Boolean(quickAdd.id);
      var result=saveQuickAddEvent(state,input,quickAdd.id||null);
      if(!result.event){quickAdd={...quickAdd,...input,errors:result.errors};render();return;}
      state=result.state;var saved=saveState();quickAdd=null;successMessage=saved?(wasEditing?'Event updated':'Clinical event saved'):'';render();
      setTimeout(function(){if(successMessage){successMessage='';render();}},1800);
    };
  }
  document.getElementById('reset-btn').onclick=function(){
    askConfirmation('Start over with default data?','This replaces your requirements, competencies, patients, and clinical events on this browser.',function(){state=createDefaultState();saveState();render();},'Start over');
  };

  document.getElementById('opportunities').addEventListener('click',function(e){
    var b=e.target.closest('.view-patient');
    if(b){
      var el=document.getElementById('patient-'+b.dataset.id);
      if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
    }
  });

  document.getElementById('requirements').addEventListener('change',function(e){
    var t=e.target;
    if(t.classList.contains('req-name')){var r=state.requirements.find(function(x){return x.id===t.dataset.id;});if(r)r.name=t.value;saveState();render();}
    else if(t.classList.contains('req-count')){var r2=state.requirements.find(function(x){return x.id===t.dataset.id;});if(r2){r2.target=Math.max(0,parseInt(t.value)||0);r2.required=r2.target;}saveState();render();}
  });
  document.getElementById('requirements').addEventListener('click',function(e){
    var d=e.target.closest('.req-del');
    if(d){var requirementId=d.dataset.id;askConfirmation('Archive this requirement?','Existing clinical events will be kept as historical records.',function(){state=archiveRequirement(state,requirementId);saveState();render();},'Archive');}
  });
  document.getElementById('add-req').onclick=function(){
    var nameEl=document.getElementById('new-req-name'),countEl=document.getElementById('new-req-count'),err=document.getElementById('req-err');
    var name=nameEl.value.trim(),count=parseInt(countEl.value);
    if(!name){err.textContent='Enter a requirement name first.';return;}
    if(isNaN(count)||count<0){err.textContent='Enter how many are required.';return;}
    state=addRequirement(state,{name:name,target:count});
    saveState();render();
  };

  document.getElementById('competencies').addEventListener('change',function(e){
    var t=e.target;
    if(t.classList.contains('comp-check')){var c=state.competencies.find(function(x){return x.id===t.dataset.id;});if(c)c.done=t.checked;saveState();render();}
    else if(t.classList.contains('comp-name')){var c2=state.competencies.find(function(x){return x.id===t.dataset.id;});if(c2)c2.name=t.value;saveState();}
  });
  document.getElementById('competencies').addEventListener('click',function(e){
    var d=e.target.closest('.comp-del');
    if(d){var competencyId=d.dataset.id;askConfirmation('Remove this competency?','This removes only this competency from the local tracker.',function(){state.competencies=state.competencies.filter(function(x){return x.id!==competencyId;});saveState();render();});}
  });
  document.getElementById('add-comp').onclick=function(){
    var nameEl=document.getElementById('new-comp-name'),err=document.getElementById('comp-err');
    var name=nameEl.value.trim();
    if(!name){err.textContent='Enter a competency name first.';return;}
    state.competencies.push({id:createId('c'),name:name,done:false});
    saveState();render();
  };

  document.getElementById('patients').addEventListener('change',function(e){
    var t=e.target;
    if(t.classList.contains('pat-label')){var p=state.patients.find(function(x){return x.id===t.dataset.id;});if(p)p.label=t.value;saveState();render();}
    else if(t.classList.contains('proc-qty')){
      var event=state.clinicalEvents.find(function(item){return item.id===t.dataset.eid;});
      var step=event&&quantityStepFor?quantityStepFor(event.procedureType):1;
      var entered=Number(t.value);
      if(!Number.isFinite(entered)||entered<step||Math.abs(entered/step-Math.round(entered/step))>.000001){t.value=event.quantity;return;}
      state=updateClinicalEvent(state,t.dataset.eid,{quantity:entered});saveState();render();
    }
    else if(t.classList.contains('proc-status-select')){
      state=updateClinicalEvent(state,t.dataset.eid,{status:t.value});saveState();render();
    }
    else if(t.classList.contains('proc-date')){
      state=updateClinicalEvent(state,t.dataset.eid,{date:t.value});saveState();
    }
    else if(t.classList.contains('proc-canals')){
      state=updateClinicalEvent(state,t.dataset.eid,{canalCount:Math.max(1,parseInt(t.value)||1)});saveState();render();
    }
  });
  document.getElementById('patients').addEventListener('click',function(e){
    if(e.target.closest('.proc-qty')||e.target.closest('.proc-status-select')||e.target.closest('.proc-date')||e.target.closest('.proc-canals'))return;
    var d=e.target.closest('.pat-del');
    if(d){var patientId=d.dataset.id;askConfirmation('Remove this patient?','Their clinical events will be retained without a patient link.',function(){state=unlinkPatient(state,patientId);saveState();render();});return;}
    var rem=e.target.closest('.proc-remove');
    if(rem){var eventId=rem.dataset.eid;askConfirmation('Delete this clinical event?','This will remove it from your clinical history and progress totals.',function(){state=deleteClinicalEvent(state,eventId);saveState();render();});return;}
    var edit=e.target.closest('.proc-edit');
    if(edit){var event=state.clinicalEvents.find(function(item){return item.id===edit.dataset.eid;});if(event)openQuickAdd(event);return;}
    var add=e.target.closest('.proc-add');
    if(add){
      var pid=add.dataset.pid;
      var reqSel=document.querySelector('.proc-req[data-pid="'+pid+'"]');
      var statSel=document.querySelector('.proc-status[data-pid="'+pid+'"]');
      var qtyEl=document.querySelector('.new-proc-qty[data-pid="'+pid+'"]');
      var dateEl=document.querySelector('.new-proc-date[data-pid="'+pid+'"]');
      var requirement=reqSel?state.requirements.find(function(item){return item.id===reqSel.value;}):null;
      if(requirement&&statSel){
        var procedureType=procedureTypeForRequirement(requirement);
        var qty=Number(qtyEl&&qtyEl.value);
        var step=quantityStepFor?quantityStepFor(procedureType):1;
        if(!Number.isFinite(qty)||qty<step||Math.abs(qty/step-Math.round(qty/step))>.000001)qty=step;
        state=addClinicalEvent(state,{procedureType:procedureType,quantity:procedureType==='rct'?1:qty,canalCount:procedureType==='rct'?qty:null,patientId:pid,requirementId:reqSel.value,requirementName:requirement.name,status:statSel.value,date:dateEl?dateEl.value:''});
        saveState();render();
      }
      return;
    }
  });
  document.getElementById('add-patient').onclick=function(){
    var nameEl=document.getElementById('new-patient'),err=document.getElementById('patient-err');
    var name=nameEl.value.trim();
    if(!name){err.textContent='Enter a patient identifier first.';return;}
    state.patients.push({id:createId('p'),label:name,procedures:[]});
    saveState();render();
  };

  document.getElementById('quote-add').onclick=function(){
    var input=document.getElementById('quote-input'),err=document.getElementById('quote-err');
    var val=input.value.trim();
    if(!val){err.textContent='Write a thought before sharing.';return;}
    communityQuotes.push(val);
    saveCommunity();
    render();
  };
}

try {
  state=loadState();
  communityQuotes=loadQuotes();
  var recoveredLoadError=getLoadError&&getLoadError();
  if(recoveredLoadError)persistenceError=recoveredLoadError.message;
} catch (e) {
  state=createDefaultState();
  communityQuotes=[];
}
render();
window.ClinicTrackBoot.started=true;
} catch (error) {
  console.error('ClinicTrack initialization failed.', error);
  var app=document.getElementById('app');
  var detail=String(error&&error.message||'Unknown initialization error').replace(/[&<>"']/g,'');
  if(app)app.innerHTML='<div class="loading">ClinicTrack couldn\'t start. Please reload the page.<br><span class="tiny-muted">'+detail+'</span></div>';
}
})();

</script>
</body>
</html>
